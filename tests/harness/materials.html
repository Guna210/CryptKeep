<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>CryptKeep base material contact sheet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; padding: 22px; background: #171a1e; color: #eef1ed; font: 14px/1.4 system-ui, sans-serif; }
      h1 { margin: 0; font-size: 22px; letter-spacing: .04em; }
      p { color: #b9c1c0; margin: 6px 0 16px; }
      #sheet { display: grid; grid-template-columns: repeat(4, 180px); gap: 14px; width: max-content; }
      figure { margin: 0; padding: 9px; background: #252a2e; border: 1px solid #42494b; }
      figure canvas { display: block; width: 160px; height: 160px; image-rendering: pixelated; background: #080a0b; }
      figcaption { padding-top: 7px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
      footer { margin-top: 12px; color: #98a2a0; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Base pixel materials</h1>
    <p>Original deterministic recipes · nearest enlarged · seed: ck-01-06 · 32 × 32 px</p>
    <main id="sheet" aria-label="Base material contact sheet"></main>
    <footer>Surface tiles: stone, floor, door · Role markers: entry, boss, reward, exit</footer>
    <script type="module" src="./materials.ts"></script>
  </body>
</html>
