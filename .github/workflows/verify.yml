name: Verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Confirm supported npm version
        run: |
          npm install --global npm@11.9.0
          node --version
          npm --version
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and runner libraries
        run: npx playwright install --with-deps chromium
      - name: Configure Playwright Chromium path
        run: |
          node --input-type=module -e 'import { chromium } from "playwright-core"; console.log(`PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${chromium.executablePath()}`)' >> "$GITHUB_ENV"
      - name: Run complete verification
        run: npm run verify
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
